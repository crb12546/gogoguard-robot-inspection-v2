# ROS 2 Humble candidate profile: go2-nav2-mppi-omni-v1.
# Values are conservative commissioning defaults. Promotion requires recorded
# replay plus a controlled obstacle course on the spare NVMe system.
controller_server:
  ros__parameters:
    use_sim_time: false
    # The clear-route target is 0.60 m/s. 15 Hz keeps enough control margin while
    # avoiding an unnecessary 20 Hz MPPI CPU tax on Orin.
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.30
    publish_zero_velocity: true
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [route_goal_checker]
    # One controller owns both the recorded route and every globally planned
    # bypass, so controller behavior does not change during a detour.
    controller_plugins: [FollowPath]

    progress_checker:
      # A planned bypass may legitimately rotate in place before moving.
      # PoseProgressChecker accepts either translation or rotation as progress.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.15
      movement_time_allowance: 3.0
    route_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      time_steps: 56
      model_dt: 0.0666667
      # A single bounded MPPI iteration follows either the blue route or a
      # SmacPlanner2D bypass; it may go left/right but never reverses route
      # ownership or replaces the fixed-map localization anchor.
      batch_size: 700
      iteration_count: 1
      vx_std: 0.18
      vy_std: 0.10
      wz_std: 0.20
      vx_max: 0.60
      # Patrol routes are directional. The Go2 may sidestep around an obstacle,
      # but it must not silently turn the route into a reverse-driving plan.
      # The commissioned Go2 only shifted its posture at a 0.10 m/s command
      # and moved 0.064 m in 15 seconds. Keep zero as the controller stop, but
      # make every sampled forward gait a physically effective command.
      vx_min: 0.20
      vy_max: 0.20
      wz_max: 0.40
      prune_distance: 1.5
      max_robot_pose_search_dist: 4.0
      transform_tolerance: 0.20
      temperature: 0.30
      gamma: 0.015
      retry_attempt_limit: 1
      reset_period: 1.0
      regenerate_noises: false
      visualize: false
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # The costmaps model the robot with one 0.48 m circle and inflate
        # obstacles around that radius. Humble's footprint mode requires an
        # explicit polygon and rejects a radius-only costmap during configure.
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.6
        inflation_layer_name: inflation_layer
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.4
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.4
        offset_from_furthest: 20
        # Route waypoints carry the surveyed map-frame tangent yaw. PathAlign
        # automatically yields to obstacle avoidance when the path is occupied.
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Field traces showed a 0.60 m/s limit settling around 0.32 m/s even
        # on a clear route. Give route progress more authority while the
        # collision critic and collision monitor keep their independent stop
        # and slowdown ownership.
        cost_weight: 8.0
        offset_from_furthest: 6
        threshold_to_consider: 1.2
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.2
        forward_preference: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      rolling_window: true
      width: 24
      height: 24
      resolution: 0.10
      robot_radius: 0.48
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: [obstacle_layer, inflation_layer]
      filters: [keepout_filter]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 1.45
        combination_method: 1
        observation_sources: mid360_body
        mid360_body:
          topic: /navigation/cloud_body
          data_type: PointCloud2
          min_obstacle_height: 0.05
          max_obstacle_height: 1.45
          obstacle_min_range: 0.15
          obstacle_max_range: 10.0
          raytrace_min_range: 0.15
          raytrace_max_range: 12.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.65
        cost_scaling_factor: 3.0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /allowed_area_filter_info

allowed_area_mask_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    topic_name: /allowed_area_mask
    frame_id: map

allowed_area_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: /allowed_area_filter_info
    mask_topic: /allowed_area_mask
    base: 0.0
    multiplier: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      # Fixed-map patrol is authorized only while map localization is usable.
      # Keep the 2D costmap in that planar product frame instead of FAST-LIO's
      # full 6-DoF odom frame, whose roll/pitch/z are valid localization input
      # but are not a valid vertical datum for Costmap2D.
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      rolling_window: true
      # Humble Costmap2D declares these two parameters as integers.
      width: 8
      height: 8
      resolution: 0.08
      # One visible physical envelope is shared with the allowed-area editor
      # and emergency collision monitor. Inflation is a cost preference, not a
      # second hard body shape.
      robot_radius: 0.48
      track_unknown_space: false
      # The patrol health gate consumes /local_costmap/costmap as a heartbeat.
      # With incremental publishing a static scene emits one full grid and then
      # looks stale even though the costmap thread is healthy. This grid is only
      # 100 x 100 cells, so a deterministic 2 Hz full snapshot is inexpensive.
      always_send_full_costmap: true
      plugins: [obstacle_layer, inflation_layer]
      filters: [keepout_filter]
      obstacle_layer:
        # Navigation owns a 2D obstacle surface. The complete 3D body cloud is
        # retained for localization, collision monitoring and incident replay;
        # it must not turn raw odom.z into a fixed voxel-volume dependency.
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 1.45
        combination_method: 1
        observation_sources: mid360_body
        mid360_body:
          topic: /navigation/cloud_body
          data_type: PointCloud2
          # Ignore the floor-return band around z=0. The commissioned incident
          # showed a one-frame StopZone hit with no persistent obstacle; real
          # traversability hazards rise above this small calibration margin.
          min_obstacle_height: 0.05
          max_obstacle_height: 1.45
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Footprint remains the hard collision boundary. A 0.65 m inflation
        # field leaves about 0.16 m preference margin without declaring an
        # ordinary doorway impassable.
        inflation_radius: 0.65
        cost_scaling_factor: 3.0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /allowed_area_filter_info

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.60, 0.20, 0.40]
    min_velocity: [0.0, -0.20, -0.40]
    max_accel: [0.90, 0.45, 0.80]
    max_decel: [-0.90, -0.45, -1.00]
    odom_topic: /Odometry
    odom_duration: 0.10
    deadband_velocity: [0.02, 0.02, 0.03]
    velocity_timeout: 0.30

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /nav2/smoothed_cmd_vel
    cmd_vel_out_topic: /patrol_cmd
    transform_tolerance: 0.30
    source_timeout: 0.20
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [SafetyEnvelope]
    SafetyEnvelope:
      type: circle
      radius: 0.48
      action_type: stop
      # Humble triggers when the in-zone count is greater than max_points.
      # Nine coherent returns still react immediately to a physical object,
      # while rejecting the observed isolated floor/self-return burst.
      max_points: 8
      visualize: true
      polygon_pub_topic: /go2/collision/safety_envelope
      enabled: true
    observation_sources: [mid360_body]
    mid360_body:
      type: pointcloud
      topic: /navigation/cloud_body
      min_height: 0.05
      max_height: 1.45
      enabled: true
