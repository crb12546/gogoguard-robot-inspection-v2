# ROS 2 Humble candidate profile: go2-nav2-mppi-omni-v1.
# Values are conservative commissioning defaults. Promotion requires recorded
# replay plus a controlled obstacle course on the spare NVMe system.
controller_server:
  ros__parameters:
    use_sim_time: false
    # Route speeds are below 0.5 m/s. 15 Hz keeps enough control margin while
    # avoiding an unnecessary 20 Hz MPPI CPU tax on Orin.
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.30
    publish_zero_velocity: true
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [route_goal_checker]
    controller_plugins: [FollowPath, DetourPath]

    progress_checker:
      # DetourPath may legitimately rotate in place before moving. Humble's
      # PoseProgressChecker accepts either translation or rotation as progress,
      # so RPP heading alignment is not mislabeled as a stalled controller.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.15
      movement_time_allowance: 3.0
    route_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      time_steps: 56
      model_dt: 0.0666667
      # A single bounded MPPI iteration plus the 6 m rolling costmap is the
      # complete local bypass: it may go left/right, but the fixed map route is
      # never re-anchored or replaced with a path back to the startup point.
      batch_size: 700
      iteration_count: 1
      vx_std: 0.18
      vy_std: 0.10
      wz_std: 0.20
      vx_max: 0.60
      # Patrol routes are directional. The Go2 may sidestep around an obstacle,
      # but it must not silently turn the route into a reverse-driving plan.
      # The commissioned Go2 only shifted its posture at a 0.10 m/s command
      # and moved 0.064 m in 15 seconds. Keep zero as the controller stop, but
      # make every sampled forward gait a physically effective command.
      vx_min: 0.20
      vy_max: 0.20
      wz_max: 0.40
      prune_distance: 1.5
      max_robot_pose_search_dist: 4.0
      transform_tolerance: 0.20
      temperature: 0.30
      gamma: 0.015
      retry_attempt_limit: 1
      reset_period: 1.0
      regenerate_noises: false
      visualize: false
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.6
        inflation_layer_name: inflation_layer
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.4
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.4
        offset_from_furthest: 20
        # Route waypoints carry the surveyed map-frame tangent yaw. PathAlign
        # automatically yields to obstacle avoidance when the path is occupied.
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 1.2
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.2
        forward_preference: true

    # RPP owns only a bounded path from the current pose to a future route
    # rejoin anchor. Once that goal succeeds, the runtime gives the remaining
    # recorded route back to MPPI. Its default survives the downstream 0.85
    # slowdown while remaining independently adjustable at launch time.
    DetourPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.40
      lookahead_dist: 0.35
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.50
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 0.40
      transform_tolerance: 0.20
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.24
      approach_velocity_scaling_dist: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.70
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.70
      regulated_linear_scaling_min_speed: 0.24
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 0.80
      allow_reversing: false
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      # Fixed-map patrol is authorized only while map localization is usable.
      # Keep the 2D costmap in that planar product frame instead of FAST-LIO's
      # full 6-DoF odom frame, whose roll/pitch/z are valid localization input
      # but are not a valid vertical datum for Costmap2D.
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      rolling_window: true
      # Humble Costmap2D declares these two parameters as integers.
      width: 6
      height: 6
      resolution: 0.08
      footprint: "[[0.40, 0.20], [0.40, -0.20], [-0.33, -0.20], [-0.33, 0.20]]"
      footprint_padding: 0.03
      track_unknown_space: false
      # The patrol health gate consumes /local_costmap/costmap as a heartbeat.
      # With incremental publishing a static scene emits one full grid and then
      # looks stale even though the costmap thread is healthy. This grid is only
      # 75 x 75 cells, so a deterministic 2 Hz full snapshot is inexpensive.
      always_send_full_costmap: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        # Navigation owns a 2D obstacle surface. The complete 3D body cloud is
        # retained for localization, collision monitoring and incident replay;
        # it must not turn raw odom.z into a fixed voxel-volume dependency.
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 1.45
        combination_method: 1
        observation_sources: mid360_body
        mid360_body:
          topic: /navigation/cloud_body
          data_type: PointCloud2
          min_obstacle_height: -0.10
          max_obstacle_height: 1.45
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Footprint remains the hard collision boundary. A 0.65 m inflation
        # field leaves about 0.16 m preference margin without declaring an
        # ordinary doorway impassable.
        inflation_radius: 0.65
        cost_scaling_factor: 3.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.60, 0.20, 0.40]
    min_velocity: [0.0, -0.20, -0.40]
    max_accel: [0.90, 0.45, 0.80]
    max_decel: [-0.90, -0.45, -1.00]
    odom_topic: /Odometry
    odom_duration: 0.10
    deadband_velocity: [0.02, 0.02, 0.03]
    velocity_timeout: 0.30

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /nav2/smoothed_cmd_vel
    cmd_vel_out_topic: /patrol_cmd
    transform_tolerance: 0.30
    source_timeout: 0.20
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [StopZone, SlowZone, FootprintApproach]
    StopZone:
      type: polygon
      points: [0.55, 0.27, 0.55, -0.27, -0.38, -0.27, -0.38, 0.27]
      action_type: stop
      # Humble calls this max_points: 3 means four in-zone returns trigger.
      max_points: 3
      visualize: true
      polygon_pub_topic: /go2/collision/stop_zone
      enabled: true
    SlowZone:
      type: polygon
      # The first field patrol proved that a +/-0.65 m rectangle latches on
      # passable side walls.  +/-0.55 m still covers the 0.20 m body half-width
      # plus 0.35 m clearance without treating the whole narrow passage as an
      # indefinitely occupied slowdown zone.
      points: [1.00, 0.30, 1.00, -0.30, -0.55, -0.30, -0.55, 0.30]
      action_type: slowdown
      max_points: 3
      # 0.45 reduced the observed 0.341 m/s command to 0.153 m/s, below the
      # commissioned Go2 gait deadband, and caused a 15 s progress failure.
      slowdown_ratio: 0.85
      visualize: true
      polygon_pub_topic: /go2/collision/slow_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 0.7
      simulation_time_step: 0.10
      max_points: 3
      visualize: false
      enabled: true
    observation_sources: [mid360_body]
    mid360_body:
      type: pointcloud
      topic: /navigation/cloud_body
      min_height: -0.10
      max_height: 1.45
      enabled: true
